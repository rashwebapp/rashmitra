<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=frontend/index.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RASH Mitra — Mengarahkan ke Frontend...</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
  <script>
    // Pengalihan instan ke folder frontend
    window.location.replace("frontend/index.html");
  </script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #FAF5EE;
      color: #2C1A14;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      padding: 32px 40px;
      border-radius: 24px;
      box-shadow: 0 10px 28px -4px rgba(184, 78, 41, 0.08);
      border: 1px solid #E6E2DB;
      max-width: 380px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #F8ECE7;
      border-top: 3px solid #B84E29;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    a {
      display: inline-block;
      margin-top: 14px;
      color: #B84E29;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2 style="margin: 0 0 8px; font-size: 18px;">RASH Mitra</h2>
    <p style="margin: 0; font-size: 13px; color: #75665E;">Membuka antarmuka aplikasi kasir...</p>
    <a href="frontend/index.html">Klik di sini jika tidak otomatis terbuka →</a>
  </div>
</body>
</html>
